<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #f0f0f0;
    }

    .card {
      background: #1e1e1e;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.50);
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    .accent-bar {
      width: 48px;
      height: 4px;
      background: #FF4D4D;
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
      color: #FF4D4D;
    }

    p {
      font-size: 1rem;
      color: #c0c0c0;
      line-height: 1.6;
    }

    .lang-switcher {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .lang-switcher button {
      border: 1px solid #333;
      border-radius: 8px;
      background: #2a2a2a;
      color: #c0c0c0;
      font-size: 0.8rem;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .lang-switcher button:hover {
      background: #333;
      color: #f0f0f0;
    }

    .lang-switcher button.active {
      background: #FF4D4D;
      border-color: #FF4D4D;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent-bar"></div>
    <h1 id="msg-title"></h1>
    <p id="msg-body"></p>

    <div class="lang-switcher" id="lang-switcher"></div>
  </div>

  <script>
    const translations = {
      en: {
        lang: "English",
        title: "Everything is set!",
        body: "Back to the app and sign in.",
      },
      hu: {
        lang: "Magyar",
        title: "Minden készen áll!",
        body: "Térj vissza az alkalmazásba és jelentkezz be.",
      },
      fi: {
        lang: "Suomi",
        title: "Kaikki on valmista!",
        body: "Palaa sovellukseen ja kirjaudu sisään.",
      },
      "pt-BR": {
        lang: "Português (BR)",
        title: "Tudo pronto!",
        body: "Volte ao aplicativo e faça login.",
      },
      es: {
        lang: "Español",
        title: "¡Todo listo!",
        body: "Vuelve a la aplicación e inicia sesión.",
      },
    };

    const supportedLocales = Object.keys(translations);

    function detectLocale() {
      const prefs = navigator.languages || [navigator.language || "en"];
      for (const pref of prefs) {
        if (translations[pref]) return pref;
        const base = pref.split("-")[0];
        const match = supportedLocales.find((l) => l === base || l.startsWith(base + "-"));
        if (match) return match;
      }
      return "en";
    }

    let currentLocale = detectLocale();

    function render(locale) {
      currentLocale = locale;
      const t = translations[locale];
      document.documentElement.lang = locale;
      document.getElementById("msg-title").textContent = t.title;
      document.getElementById("msg-body").textContent = t.body;

      document.querySelectorAll("#lang-switcher button").forEach((btn) => {
        const isActive = btn.dataset.locale === locale;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    // Build language switcher buttons
    const switcher = document.getElementById("lang-switcher");
    for (const [locale, t] of Object.entries(translations)) {
      const btn = document.createElement("button");
      btn.dataset.locale = locale;
      btn.lang = locale;
      btn.setAttribute("aria-pressed", "false");
      btn.textContent = t.lang;
      btn.addEventListener("click", () => render(locale));
      switcher.appendChild(btn);
    }

    render(currentLocale);
  </script>
</body>
</html>
